<script type="application/json" id="proto-meta">
{ "물음": "「다른 계열 20%」눈금으로 3단계까지 평균 몇 번 합성하나",
  "기준": ["1000회 시뮬 평균 12회 이하", "늪 첫 마리까지 평균 횟수 (숫자)", "대기 시간 합 60분 안에 변종 1~3마리"],
  "만든날": "2026-09-07" }
</script>
<meta charset="utf-8">
<title>q1-3 합성 횟수 시뮬</title>
<style>
  body { font-family: monospace; margin: 16px; background: #fff; color: #000; }
  fieldset { border: 1px solid #000; margin-bottom: 12px; }
  label { margin-right: 12px; }
  input { width: 70px; }
  table { border-collapse: collapse; margin: 8px 0; }
  td, th { border: 1px solid #000; padding: 2px 8px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  #log { white-space: pre; border: 1px solid #000; padding: 6px; max-height: 320px; overflow: auto; }
  textarea { width: 100%; height: 140px; }
  .pass { background: #cfc; } .fail { background: #fcc; }
</style>

<h2>q1-3 · 「다른 계열 20%」로 3단계까지 평균 몇 번 합성하나</h2>

<fieldset>
  <label>씨앗 <input id="seed" type="number" value="1"></label>
  <label>다른 계열 % <input id="pOther" type="number" value="20"></label>
  <label>변종 % <input id="pVar" type="number" value="15"></label>
  <label>횟수 <input id="runs" type="number" value="1000"></label>
  <button id="btnOne">1회 (과정 보기)</button>
  <button id="btnMany">1000회</button>
</fieldset>

<div id="result"></div>
<div id="log"></div>

<fieldset>
  <legend>JSON 내보내기</legend>
  <textarea id="json"></textarea><br>
  <button id="btnCopy">복사</button> <span id="copied"></span>
</fieldset>

<script>
// ===== 상수 덩이 (CONST) — 눈금은 전부 03-시스템-합성소.md 의 임시값 =====
const CONST = {
  P_OTHER: 20,          // ② 다른 계열 % (화면 입력으로 덮어씀)
  P_VARIANT: 15,        // ③ 빛나는 변종 % (화면 입력으로 덮어씀)
  P_OTHER_T3: 60,       // 3단계끼리 : ② 60 / ③ 40 (이 시뮬에선 3단계 짝을 안 합성해 안 쓰임)
  WAIT_MIN: { 1: 5, 2: 30, 3: 120 },   // 재료 낮은 단계 기준 대기 시간(분)
  WAIT_LIMIT: 60,       // (c) 변종 집계 대기 시간 상한(분)
  RUNS: 1000,
  MAX_SYNTH: 1000,      // 한 회차 안전 상한
  FAMILIES: ['잔디', '물', '용암', '늪'],
  OPEN_AT_START: ['잔디', '물', '용암'],
  MAX_TIER: 3,
};

// SIM-BEGIN  (여기부터 SIM-END 까지 순수 함수 — node 검증에 그대로 복사)
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// 한 회차 시뮬. 돌려주는 값 : { toT3, toSwamp, variants60, synths, log }
//  toT3     : 어느 계열이든 3단계 첫 마리까지 합성 횟수 (못 닿으면 null)
//  toSwamp  : 늪 1단계 첫 마리까지 합성 횟수 (못 닿으면 null)
//  variants60 : 대기 시간 누적 60분 안에 나온 변종 수
function simulateOne(seed, opt) {
  const rnd = mulberry32(seed);
  const pOther = opt.pOther / 100, pVar = opt.pVar / 100;
  const want = !!opt.log;
  const log = [];
  const open = CONST.OPEN_AT_START.slice();
  // 보관함 : 종별 마릿수. 변종은 따로 모아 두고 재료로 안 쓴다.
  const inv = {}; const varInv = {};
  const key = (f, t) => f + t;
  const cnt = (f, t) => inv[key(f, t)] || 0;
  const add = (f, t, n) => { inv[key(f, t)] = cnt(f, t) + n; };
  const isGrass1 = (f, t) => f === '잔디' && t === 1;   // 무한 공급
  const has = (f, t, n) => isGrass1(f, t) ? true : cnt(f, t) >= n;
  const take = (f, t, n) => { if (!isGrass1(f, t)) add(f, t, -n); };

  let synths = 0, wait = 0, toT3 = null, toSwamp = null, variants60 = 0;
  const swampOpen = () => open.includes('늪');

  function pickPair() {
    // 1) 늪 첫 마리 전이면 잔디 2+ 와 물 2+ 가 같이 있을 때 교차 합성 우선
    if (!swampOpen()) {
      // 재료는 2단계만 쓴다 — 3단계는 아까워서 안 쓴다 (가정)
      if (has('잔디', 2, 1) && has('물', 2, 1)) return [['잔디', 2], ['물', 2]];
    }
    // 2) 같은 종 같은 단계 짝 — 높은 단계 먼저 (3단계 짝은 다음 단계가 없어 안 합성)
    for (let t = CONST.MAX_TIER - 1; t >= 1; t--)
      for (const f of CONST.FAMILIES) if (!isGrass1(f, t) && cnt(f, t) >= 2) return [[f, t], [f, t]];   // 보관함에 실제로 있는 짝만 (무한 잔디1은 3)에서)
    // 3) 짝이 없으면 잔디 1단계를 무한히 꺼내 쓴다
    return [['잔디', 1], ['잔디', 1]];
  }

  function fixedResult(a, b) {   // ① 정해진 종
    if (a[0] === b[0]) return [a[0], a[1] + 1];
    if (a[0] === '잔디' && b[0] === '물' && a[1] >= 2 && b[1] >= 2) return ['늪', 1];
    return [a[0], a[1] + 1];
  }

  while (synths < CONST.MAX_SYNTH) {
    if (toT3 !== null && toSwamp !== null && wait > CONST.WAIT_LIMIT) break;
    const [a, b] = pickPair();
    take(a[0], a[1], 1); take(b[0], b[1], 1);
    synths++;
    wait += CONST.WAIT_MIN[Math.min(a[1], b[1])];

    const r = rnd();
    let out, branch;
    const fixed = fixedResult(a, b);
    if (r < pVar) { branch = '③변종'; out = fixed; }
    else if (r < pVar + pOther) {
      branch = '②다른계열';
      const cands = open.filter(f => f !== a[0] && f !== b[0]);
      out = [cands[Math.floor(rnd() * cands.length)], 1];
    } else { branch = '①정해진종'; out = fixed; }

    const isVar = branch === '③변종';
    if (isVar) { varInv[key(out[0], out[1])] = (varInv[key(out[0], out[1])] || 0) + 1; }
    else add(out[0], out[1], 1);
    if (isVar && wait <= CONST.WAIT_LIMIT) variants60++;
    if (out[0] === '늪' && !swampOpen()) { open.push('늪'); if (toSwamp === null) toSwamp = synths; }
    if (out[1] >= CONST.MAX_TIER && toT3 === null) toT3 = synths;

    if (want) log.push(`#${synths} ${a[0]}${a[1]} + ${b[0]}${b[1]} → ${out[0]}${out[1]}${isVar ? '★' : ''} [${branch}] 대기 +${CONST.WAIT_MIN[Math.min(a[1], b[1])]}분 = ${wait}분`
      + (toT3 === synths ? '  ← 3단계 첫 마리' : '') + (toSwamp === synths ? '  ← 늪 첫 마리' : ''));
  }
  return { toT3, toSwamp, variants60, synths, log };
}

function stats(arr) {
  const v = arr.filter(x => x !== null).sort((a, b) => a - b);
  if (!v.length) return { n: 0, avg: null, min: null, max: null, med: null };
  const sum = v.reduce((s, x) => s + x, 0);
  const med = v.length % 2 ? v[(v.length - 1) / 2] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2;
  return { n: v.length, avg: sum / v.length, min: v[0], max: v[v.length - 1], med };
}

function histogram(arr, bins) {   // bins : [[lo,hi],...] 마지막 hi 는 Infinity
  return bins.map(([lo, hi]) => ({ range: hi === Infinity ? `${lo}+` : `${lo}~${hi}`, count: arr.filter(x => x !== null && x >= lo && x <= hi).length }));
}

function simulateMany(seed, runs, opt) {
  const t3 = [], sw = [], vr = [];
  let capped = 0;
  for (let i = 0; i < runs; i++) {
    const r = simulateOne(seed * 100003 + i, opt);
    t3.push(r.toT3); sw.push(r.toSwamp); vr.push(r.variants60);
    if (r.synths >= CONST.MAX_SYNTH) capped++;
  }
  const bins = [[1, 3], [4, 6], [7, 9], [10, 12], [13, 15], [16, 20], [21, 30], [31, 50], [51, Infinity]];
  const vbins = [[0, 0], [1, 1], [2, 2], [3, 3], [4, Infinity]];
  return {
    seed, runs, pOther: opt.pOther, pVar: opt.pVar, capped,
    toT3: stats(t3), toSwamp: stats(sw), variants60: stats(vr),
    histT3: histogram(t3, bins), histSwamp: histogram(sw, bins), histVar: histogram(vr, vbins),
    variants60_1to3: vr.filter(x => x >= 1 && x <= 3).length,
  };
}
// SIM-END

// ===== 화면 =====
const $ = id => document.getElementById(id);
const opt = () => ({ pOther: +$('pOther').value, pVar: +$('pVar').value });
const f1 = x => x === null ? '-' : (Math.round(x * 100) / 100);

function statRow(name, s) { return `<tr><td>${name}</td><td>${f1(s.avg)}</td><td>${f1(s.min)}</td><td>${f1(s.max)}</td><td>${f1(s.med)}</td><td>${s.n}</td></tr>`; }
function histTable(title, h) {
  return `<b>${title}</b><table><tr><th>구간</th><th>건수</th></tr>${h.map(r => `<tr><td>${r.range}</td><td>${r.count}</td></tr>`).join('')}</table>`;
}

$('btnOne').onclick = () => {
  const r = simulateOne(+$('seed').value, { ...opt(), log: true });
  $('result').innerHTML = `<b>1회 결과</b> 3단계까지 ${r.toT3 ?? '못 닿음'}회 · 늪까지 ${r.toSwamp ?? '못 닿음'}회 · 60분 안 변종 ${r.variants60}마리 · 총 합성 ${r.synths}회`;
  $('log').textContent = r.log.join('\n');
  $('json').value = JSON.stringify({ 종류: '1회', 씨앗: +$('seed').value, ...opt(), toT3: r.toT3, toSwamp: r.toSwamp, variants60: r.variants60, synths: r.synths }, null, 1);
};

$('btnMany').onclick = () => {
  const runs = +$('runs').value || CONST.RUNS;
  const R = simulateMany(+$('seed').value, runs, opt());
  const c1 = R.toT3.avg !== null && R.toT3.avg <= 12;
  const c3 = R.variants60.avg >= 1 && R.variants60.avg <= 3;
  $('result').innerHTML = `
    <table><tr><th>잰 것</th><th>평균</th><th>최소</th><th>최대</th><th>중앙값</th><th>닿은 회차</th></tr>
    ${statRow('3단계 첫 마리까지 합성 횟수', R.toT3)}
    ${statRow('늪 1단계 첫 마리까지 합성 횟수', R.toSwamp)}
    ${statRow('대기 60분 안 변종 수', R.variants60)}
    </table>
    <div>상한(${CONST.MAX_SYNTH}회)에 걸린 회차 ${R.capped} · 60분 안 변종이 1~3마리인 회차 ${R.variants60_1to3}/${runs}</div>
    <div style="display:flex;gap:24px">${histTable('3단계까지 횟수 분포', R.histT3)}${histTable('늪까지 횟수 분포', R.histSwamp)}${histTable('60분 안 변종 수 분포', R.histVar)}</div>
    <b>판정 기준</b>
    <table><tr><th>기준</th><th>지금 값</th><th>판정</th></tr>
    <tr class="${c1 ? 'pass' : 'fail'}"><td>① 1000회 시뮬 평균 12회 이하</td><td>${f1(R.toT3.avg)}회</td><td>${c1 ? '통과' : '불통'}</td></tr>
    <tr><td>② 늪 첫 마리까지 평균 횟수 (숫자)</td><td>${f1(R.toSwamp.avg)}회</td><td>숫자 기록</td></tr>
    <tr class="${c3 ? 'pass' : 'fail'}"><td>③ 대기 60분 안에 변종 1~3마리</td><td>평균 ${f1(R.variants60.avg)}마리</td><td>${c3 ? '통과' : '불통'}</td></tr>
    </table>`;
  $('log').textContent = '';
  $('json').value = JSON.stringify(R, null, 1);
};

$('btnCopy').onclick = () => {
  $('json').select();
  try { document.execCommand('copy'); } catch (e) {}
  if (navigator.clipboard) navigator.clipboard.writeText($('json').value).catch(() => {});
  $('copied').textContent = '복사됨';
};
</script>
