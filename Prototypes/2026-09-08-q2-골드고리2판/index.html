           "q2-1 ④ 끝나고 한 판 더 (예/아니오) · 질린 시점(분)",
           "q2-2 ① 새 종을 얻고 짝(2마리째)까지 게임 시간 10분 이하",
           "q2-2 ② 짝 구매가 골드 유출의 20~40%",
           "q2-2 ③ 구매 횟수 ≤ 합성 횟수"],
  "만든날": "2026-09-08" }

<title>q2 골드 고리 2판 프로토</title>
<style>

<script>
// ===CORE START===
// 게임 논리. 화면과 떼어 놓았다. node 봇도 이 구간을 그대로 쓴다.
// 2판(2026-09-08) 에서 더한 것 : 합성소 칸 1~4 (s.synth 가 칸 배열) · 영구 단축 5단계 (s.speedLevel).
const CONST = {
  TICK: 0.1,                 // 게임 시간 1틱 = 0.1초
  START_SPECIES: '잔디1', START_COUNT: 2, START_GOLD: 0,
  POWDER_PERIOD: 15,         // 찹쌀이 1마리당 가루 1개 (초)
  SUB_PERIOD: 30,            // 찹쌀이 1마리당 부재료 1개 (초)
  TIER_PERIOD_MULT: [1, 1.5, 2],   // 부재료 주기 배수 (1·2·3단계)
  FLOOR_CAP: 60,             // 바닥 상한 (가루+부재료 합계)
  RICE_PRICE: [10, 30, 90],  // 떡 값 (부재료 단계별)
  SYNTH_COST: [100, 500, 2000],       // 합성 골드 (낮은 단계 기준)
  SYNTH_TIME: [5*60, 30*60, 120*60],  // 합성 대기 (초, 단축 전)
  P_FIXED: 0.65, P_OTHER: 0.20, P_VARIANT: 0.15,  // 세 갈래 (2판 : 변종 15%)
  P3_OTHER: 0.60, P3_VARIANT: 0.40,               // 3단계끼리 (다음 단계 없음)
  BREED_PERIOD: 180,         // 같은 종 2마리 이상이면 3분마다 1마리
  BUY_PRICE: [150, 750],     // 도감에 열린 일반 종 짝 구매 (1단계·2단계). 3단계·변종은 안 판다
  MOZZI_SELL_PRICE: 20,      // 잉여 찹쌀이 팔기
  // --- 2판 소비처 (값은 전부 임시) ---
  SLOT_MAX: 4,                       // 합성소 칸 상한
  SLOT_PRICE: [300, 1000, 3000],     // 2칸·3칸·4칸 값
  SPEED_STEPS: [0.9, 0.8, 0.7, 0.6, 0.5],       // 영구 단축 1~5단계 (대기 배수)
  SPEED_PRICE: [200, 400, 800, 1600, 3200],      // 단축 값 (지수)
};
const LINEAGES = ['잔디','물','용암','늪'];
const NAMES = {잔디:['흰찹쌀이','풀찹쌀이','나무찹쌀이'], 물:['물찹쌀이','파도찹쌀이','상어찹쌀이'],
  용암:['불찹쌀이','용암찹쌀이','화산찹쌀이'], 늪:['늪찹쌀이','이끼찹쌀이','악어찹쌀이']};
const SUBNAMES = {잔디:'풀', 물:'물풀', 용암:'숯', 늪:'이끼'};
const SPECIES = {}; const SPECIES_LIST = [];
for (const l of LINEAGES) for (let t=1;t<=3;t++) for (const v of [false,true]) {
  const key = l+t+(v?'v':'');
  const sp = {key, l, t, v, name: (v?'빛나는 ':'')+NAMES[l][t-1], subKey: l+':'+t};
  SPECIES[key]=sp; SPECIES_LIST.push(sp);
}
function subName(subKey){ const [l,t]=subKey.split(':'); return SUBNAMES[l]+'('+t+'단계)'; }
function subTier(subKey){ return +subKey.split(':')[1]; }
function riceName(subKey){ const [l,t]=subKey.split(':'); return SUBNAMES[l]+'떡('+t+'단계)'; }
function ricePrice(subKey){ return CONST.RICE_PRICE[subTier(subKey)-1]; }

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function newState(seed){
  const s = { time:0, gold:CONST.START_GOLD, farm:{}, prodAcc:{}, breedAcc:{},
    floor:{powder:0, sub:{}}, wh:{powder:0, sub:{}, rice:{}},
    synth:[null],              // 합성소 칸 배열. 칸마다 null 또는 {a,b,remain,total,pv}. 길이 = 산 칸 수
    speedLevel:0,              // 영구 단축 단계 0~5
    dex:{}, swampOpen:false, log:[],
    stats:{synthStarted:0, synthDone:0, goldZeroGameTime:0, bred:0, bought:0, mozziSold:0, riceSold:0, goldEarned:0,
      // --- 2판 기록 ---
      slotGold:0,              // 칸 구매에 쓴 골드 합계
      speedGold:0,             // 단축 구매에 쓴 골드 합계
      synthGold:0,             // 합성에 쓴 골드 합계
      buyGold:0,               // 짝 구매에 쓴 골드 합계 (소단계 4 에서 2단계 값이 더해진다)
      multiRunTime:0,          // 2칸 이상 동시에 돈 게임 시간 (초)
      anyRunTime:0,            // 1칸 이상 돈 게임 시간 (초)
      pairWait:{},             // 종 key → 새 종 첫 마리에서 2마리째까지 걸린 게임 초 (소단계 5 에서 q2-2 ① 판정에 쓴다)
    },
    rng: mulberry32(seed||1) };
  addMozzi(s, CONST.START_SPECIES, CONST.START_COUNT);
  return s;
}
function addMozzi(s, key, n){
  s.farm[key]=(s.farm[key]||0)+(n||1);
  if(!s.dex[key]){ s.dex[key]=s.time; }
  if(s.farm[key]>=2 && s.stats.pairWait[key]===undefined) s.stats.pairWait[key]=s.time-s.dex[key];
  if(SPECIES[key].l==='늪') s.swampOpen=true;
}
function removeMozzi(s, key, n){ s.farm[key]-= (n||1); if(s.farm[key]<=0) delete s.farm[key]; }
function farmTotal(s){ return Object.values(s.farm).reduce((a,b)=>a+b,0); }
function floorTotal(s){ return s.floor.powder + Object.values(s.floor.sub).reduce((a,b)=>a+b,0); }
function floorFull(s){ return floorTotal(s) >= CONST.FLOOR_CAP; }
function openLineages(s){ return ['잔디','물','용암'].concat(s.swampOpen?['늪']:[]); }
function dexCount(s){ return Object.keys(s.dex).length; }
function sum(o){ return Object.values(o).reduce((a,b)=>a+b,0); }
function hasAnything(s){ return s.gold>0 || sum(s.wh.rice)>0 || s.wh.powder>0 || sum(s.wh.sub)>0 || floorTotal(s)>0; }
// 기준 ① 근사 : 골드 0 이고 떡도 재료(창고+바닥)도 없다
function isStuck(s){ return !hasAnything(s); }
// 합성소 칸
function slotCount(s){ return s.synth.length; }
function runningCount(s){ return s.synth.filter(x=>x).length; }
function freeSlot(s){ const i=s.synth.indexOf(null); return i<0?null:i; }
function speedMult(s){ return s.speedLevel>0 ? CONST.SPEED_STEPS[s.speedLevel-1] : 1; }

function tick(s){
  const dt = CONST.TICK; s.time += dt;
  // 생산 (바닥 상한 넘으면 멈춤)
  if(!floorFull(s)){
    for(const key in s.farm){
      const sp=SPECIES[key], n=s.farm[key];
      const acc = s.prodAcc[key] || (s.prodAcc[key]={p:0,sub:0});
      acc.p += n*dt/CONST.POWDER_PERIOD;
      acc.sub += n*dt/(CONST.SUB_PERIOD*CONST.TIER_PERIOD_MULT[sp.t-1]);
      while(acc.p>=1 && !floorFull(s)){ acc.p-=1; s.floor.powder++; }
      while(acc.sub>=1 && !floorFull(s)){ acc.sub-=1; s.floor.sub[sp.subKey]=(s.floor.sub[sp.subKey]||0)+1; }
      if(acc.p>1) acc.p=1; if(acc.sub>1) acc.sub=1;   // 가득 찬 사이에 쌓인 몫은 버린다
    }
  }
  // 번식 (같은 종 2마리 이상 · 변종 제외)
  for(const key in s.farm){
    const sp=SPECIES[key];
    if(sp.v || s.farm[key]<2){ s.breedAcc[key]=0; continue; }
    s.breedAcc[key]=(s.breedAcc[key]||0)+dt;
    if(s.breedAcc[key]>=CONST.BREED_PERIOD){ s.breedAcc[key]-=CONST.BREED_PERIOD; addMozzi(s,key,1); s.stats.bred++; s.log.push(fmt(s.time)+' 번식 '+sp.name); }
  }
  // 합성 시계 (칸마다) · 동시 가동 시간
  const running=runningCount(s);
  if(running>=1) s.stats.anyRunTime+=dt;
  if(running>=2) s.stats.multiRunTime+=dt;
  for(let i=0;i<s.synth.length;i++){ const sy=s.synth[i]; if(sy){ sy.remain-=dt; if(sy.remain<=0) finishSynth(s,i); } }
  if(isStuck(s)) s.stats.goldZeroGameTime += dt;
}
function fmt(t){ t=Math.floor(t); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }

function pickup(s){
  s.wh.powder += s.floor.powder; s.floor.powder=0;
  for(const k in s.floor.sub){ s.wh.sub[k]=(s.wh.sub[k]||0)+s.floor.sub[k]; }
  s.floor.sub={};
}
// 떡 만들기 : 가루 1 + 부재료 1 → 떡 1. n 은 숫자 또는 'all'
function craft(s, subKey, n){
  let can = Math.min(s.wh.powder, s.wh.sub[subKey]||0);
  if(n!=='all') can=Math.min(can,n);
  if(can<=0) return 0;
  s.wh.powder-=can; s.wh.sub[subKey]-=can; if(s.wh.sub[subKey]<=0) delete s.wh.sub[subKey];
  s.wh.rice[subKey]=(s.wh.rice[subKey]||0)+can; return can;
}
// 전부 만들기 : 비싼 부재료(높은 단계)부터
function craftAll(s){ let made=0; for(const k of Object.keys(s.wh.sub).sort((a,b)=>subTier(b)-subTier(a))) made+=craft(s,k,'all'); return made; }
function sell(s, subKey, n){
  let can = s.wh.rice[subKey]||0; if(n!=='all') can=Math.min(can,n); if(can<=0) return 0;
  s.wh.rice[subKey]-=can; if(s.wh.rice[subKey]<=0) delete s.wh.rice[subKey];
  const g=can*ricePrice(subKey); s.gold+=g; s.stats.riceSold+=can; s.stats.goldEarned+=g; return g;
}
function sellAll(s){ let g=0; for(const k of Object.keys(s.wh.rice)) g+=sell(s,k,'all'); return g; }

// ---- 합성 ----
function nextTier(l,t){ return t>=3?null:l+(t+1); }
function fixedResult(a,b){
  const A=SPECIES[a], B=SPECIES[b]; const low=Math.min(A.t,B.t);
  if(A.l===B.l) return nextTier(A.l, low);
  const set=[A.l,B.l];
  if(set.includes('잔디')&&set.includes('물')&&A.t>=2&&B.t>=2) return '늪1';
  return nextTier(A.l, low);     // 첫 슬롯 계열의 다음 단계
}
function otherCandidates(s,a,b){ const ex=[SPECIES[a].l,SPECIES[b].l]; return openLineages(s).filter(l=>!ex.includes(l)).map(l=>l+'1'); }
// 단축 전 기본 비용. 단축이 걸린 실제 대기는 preview().cost.time
function synthCost(a,b){ const low=Math.min(SPECIES[a].t,SPECIES[b].t)-1; return {gold:CONST.SYNTH_COST[low], time:CONST.SYNTH_TIME[low]}; }
function preview(s,a,b){
  if(!a||!b) return null;
  const fixed=fixedResult(a,b), others=otherCandidates(s,a,b), base=synthCost(a,b);
  const cost={gold:base.gold, time:Math.round(base.time*speedMult(s)), baseTime:base.time};
  const variantOf = fixed ? fixed+'v' : SPECIES[a].l+SPECIES[a].t+'v';
  const outs=[];
  if(fixed){
    outs.push({p:CONST.P_FIXED, key:fixed, label:'정해진 종'});
    outs.push({p:CONST.P_OTHER, keys:others, label:'다른 계열 1단계'});
    outs.push({p:CONST.P_VARIANT, key:variantOf, label:'빛나는 변종'});
  } else {
    outs.push({p:CONST.P3_OTHER, keys:others, label:'다른 계열 1단계'});
    outs.push({p:CONST.P3_VARIANT, key:variantOf, label:'빛나는 변종'});
  }
  return {cost, outs, fixed, others, variantOf};
}
// i : 칸 번호. 빠지면 빈 칸을 찾는다
function canSynth(s,a,b,i){
  if(!a||!b) return '슬롯이 비었다';
  if(i===undefined) i=freeSlot(s);
  if(i===null || i>=s.synth.length) return '빈 칸이 없다';
  if(s.synth[i]) return '이 칸은 합성 중';
  if(a===b){ if((s.farm[a]||0)<2) return '같은 종은 2마리 필요'; }
  else { if(!(s.farm[a]>0)||!(s.farm[b]>0)) return '농장에 없는 종'; }
  if(s.gold<synthCost(a,b).gold) return '골드 부족';
  return null;
}
function startSynth(s,a,b,i){
  if(i===undefined) i=freeSlot(s);
  const why=canSynth(s,a,b,i); if(why) return why;
  const pv=preview(s,a,b);     // 단축은 여기서 굳는다 — 진행 중인 합성은 뒤에 단축을 사도 그대로
  s.gold-=pv.cost.gold; s.stats.synthGold+=pv.cost.gold; removeMozzi(s,a); removeMozzi(s,b);
  s.synth[i]={a,b,remain:pv.cost.time,total:pv.cost.time,pv};
  s.stats.synthStarted++; s.log.push(fmt(s.time)+' 합성 시작 ['+(i+1)+'칸] '+SPECIES[a].name+'+'+SPECIES[b].name+' ('+pv.cost.gold+'골드 · '+fmt(pv.cost.time)+')');
  return null;
}
function finishSynth(s,i){
  const {pv}=s.synth[i]; const r=s.rng(); let acc=0, got=null, way='';
  for(const o of pv.outs){ acc+=o.p; if(r<acc){ way=o.label; if(o.key) got=o.key; else { got = o.keys.length? o.keys[Math.floor(s.rng()*o.keys.length)] : (pv.fixed||pv.variantOf); } break; } }
  if(!got){ got=pv.fixed||pv.variantOf; way='정해진 종'; }
  const isNew=!s.dex[got];
  addMozzi(s,got,1); s.stats.synthDone++; s.synth[i]=null;
  s.log.push(fmt(s.time)+' 합성 결과 ['+(i+1)+'칸·'+way+'] '+SPECIES[got].name+(isNew?' (도감 새 칸!)':''));
}
// 칸 사기 : 다음 칸 값. 상한이면 null
function slotPrice(s){ const n=slotCount(s); return n>=CONST.SLOT_MAX?null:CONST.SLOT_PRICE[n-1]; }
function buySlot(s){
  const p=slotPrice(s); if(p===null) return '칸이 다 찼다';
  if(s.gold<p) return '골드 부족';
  s.gold-=p; s.stats.slotGold+=p; s.synth.push(null);
  s.log.push(fmt(s.time)+' 합성소 '+slotCount(s)+'칸 ('+p+'골드)'); return null;
}
// 단축 사기 : 다음 단계 값. 상한이면 null
function speedPrice(s){ return s.speedLevel>=CONST.SPEED_STEPS.length?null:CONST.SPEED_PRICE[s.speedLevel]; }
function buySpeed(s){
  const p=speedPrice(s); if(p===null) return '단축이 끝까지 찼다';
  if(s.gold<p) return '골드 부족';
  s.gold-=p; s.stats.speedGold+=p; s.speedLevel++;
  s.log.push(fmt(s.time)+' 단축 '+s.speedLevel+'단계 · 대기 '+Math.round(speedMult(s)*100)+'% ('+p+'골드)'); return null;
}
// 짝 구매 값. 못 파는 종(3단계·변종·도감에 없음·안 열린 계열)은 null
function buyPrice(s,key){
  const sp=SPECIES[key]; if(!sp||sp.v||sp.t>2) return null;
  if(!openLineages(s).includes(sp.l)||!s.dex[key]) return null;
  return CONST.BUY_PRICE[sp.t-1];
}
// key : 종 key ('물2'). 1판 호환으로 계열 이름('물')만 주면 1단계로 본다
function buy(s,key){
  if(LINEAGES.includes(key)) key+='1';
  const p=buyPrice(s,key); if(p===null) return '안 파는 종';
  if(s.gold<p) return '골드 부족';
  s.gold-=p; s.stats.buyGold+=p; addMozzi(s,key,1); s.stats.bought++; return null;
}
// ---- 자동 판정 (소단계 5) ----
// extra : {skips: 5분 건너뛰기 횟수, realSec: 실제 논 시간(초), snap30: 30분 시점 {gold,earned} 또는 null}
// 돌려주는 꼴 : {'q2-1':{①:{값,통과,메모}, …}, 'q2-2':{…}}. 봇도 이 함수를 쓴다.
function judge(s, extra){
  extra=extra||{}; const st=s.stats, skips=extra.skips||0, realSec=extra.realSec||0, snap=extra.snap30||null;
  const pct=x=>Math.round(x*100)+'%';
  const r={'q2-1':{}, 'q2-2':{}};
  // q2-1 ① 남은 골드 ÷ 번 골드 20% 이하 — 30분 시점 값이 있으면 그것으로 판정
  const nowRatio=st.goldEarned?s.gold/st.goldEarned:0, snapRatio=snap&&snap.earned?snap.gold/snap.earned:null;
  const useRatio=snapRatio!==null?snapRatio:nowRatio;
  r['q2-1']['①']={값:pct(useRatio), 통과:useRatio<=0.2, 메모:'지금 '+pct(nowRatio)+(snapRatio!==null?' · 30분 시점 '+pct(snapRatio):' · 30분 시점 아직')};
  // q2-1 ② 30분에 건너뛰기 20회 이하 — 30분 미만이면 환산값으로 판정
  const scaled=(realSec>0&&realSec<1800)?skips*1800/realSec:skips;
  r['q2-1']['②']={값:skips+'회', 통과:scaled<=20, 메모:(realSec>0&&realSec<1800)?'30분 환산 '+Math.round(scaled)+'회':'30분 채움'};
  // q2-1 ③ 2칸 이상 동시 가동 비율 50% 이상 (게임 시간)
  const multi=s.time>0?st.multiRunTime/s.time:0;
  r['q2-1']['③']={값:pct(multi), 통과:multi>=0.5, 메모:fmt(st.multiRunTime)+' / '+fmt(s.time)};
  // q2-1 ④ 사용자가 씀
  r['q2-1']['④']={값:'—', 통과:null, 메모:'사용자가 결과.md 에 씀'};
  // q2-2 ① 새 종 → 짝까지 게임 시간 10분 이하. 시작 종과 변종(번식 불가)은 뺀다. 짝 못 맞춘 종은 미완
  const waits=[], undone=[];
  for(const k in s.dex){ if(k===CONST.START_SPECIES||SPECIES[k].v) continue; if(st.pairWait[k]!==undefined) waits.push(st.pairWait[k]); else undone.push(SPECIES[k].name); }
  const avg=waits.length?Math.round(waits.reduce((a,b)=>a+b,0)/waits.length):null, max=waits.length?Math.round(Math.max(...waits)):null;
  r['q2-2']['①']={값:avg===null?'—':'평균 '+fmt(avg)+' · 최대 '+fmt(max), 통과:avg===null?null:avg<=600, 메모:'짝 맞춘 종 '+waits.length+' · 미완 '+undone.length+(undone.length?' ('+undone.join('·')+')':''), 평균초:avg, 최대초:max, 미완:undone.length};
  // q2-2 ② 짝 구매 골드 ÷ 총 유출 20~40%
  const out=st.slotGold+st.speedGold+st.synthGold+st.buyGold, share=out?st.buyGold/out:0;
  r['q2-2']['②']={값:pct(share), 통과:share>=0.2&&share<=0.4, 메모:st.buyGold+' / '+out};
  // q2-2 ③ 구매 횟수 ≤ 합성 횟수
  r['q2-2']['③']={값:st.bought+' ≤ '+st.synthStarted, 통과:st.bought<=st.synthStarted, 메모:''};
  return r;
}
function sellMozzi(s,key){ if(!(s.farm[key]>0)) return '없음'; removeMozzi(s,key); s.gold+=CONST.MOZZI_SELL_PRICE; s.stats.mozziSold++; return null; }

const CORE = {CONST,SPECIES,SPECIES_LIST,LINEAGES,SUBNAMES,newState,tick,pickup,craft,craftAll,sell,sellAll,preview,canSynth,startSynth,buy,sellMozzi,openLineages,farmTotal,floorTotal,floorFull,dexCount,isStuck,subName,riceName,ricePrice,fmt,sum,synthCost,
  slotCount,runningCount,freeSlot,speedMult,slotPrice,buySlot,speedPrice,buySpeed,buyPrice,judge};
if(typeof module!=='undefined') module.exports=CORE;
// ===CORE END===
</script>

<div id="top"></div>
<div class="row">
  <div class="box" id="farm"></div>
  <div class="box" id="wh"></div>
</div>
<div class="box" id="synth">
  <div id="synthHead"></div>
  <div class="row" id="synthCards">
    <div class="card" id="syn0"></div><div class="card" id="syn1"></div><div class="card" id="syn2"></div><div class="card" id="syn3"></div>
  </div>
  <div id="synthShop"></div>
</div>
<div class="row">
  <div class="box" id="shop"></div>
  <div class="box" id="dexbox"></div>
</div>
<div class="box"><h3>합성 로그</h3><div id="log"></div></div>
<div class="box" id="record"></div>

<script>
// ===== 화면 · 기록 (버릴 코드) =====
const S = newState(Date.now()%100000);
const UI = { speed:1, started:false, startedAt:0, realPlayed:0, lastFrame:0,
  slots: Array.from({length:CONST.SLOT_MAX}, ()=>({a:'', b:'', dirty:false})),   // 칸마다 고른 슬롯
  clicks:{}, lastClick:0, idleCount:0, idleFlagged:false, stuckRealTime:0, speedLog:[], snap30:null, lastTickReal:0, acc:0 };
function rec(name){ UI.clicks[name]=(UI.clicks[name]||0)+1; UI.lastClick=performance.now(); UI.idleFlagged=false; }

// 기록 객체. JSON 으로 내보내는 것은 buildRecord() 가 여기서 읽어 만든다.
// 1판 키는 그대로 두고 2판 키만 더했다 — 1판 JSON 과 나란히 비교할 수 있게.
const REC = {
  // 소단계 4~6 은 2026-09-08 에 다 붙었다. 판정은 CORE.judge(S, extra) 가 계산하고 buildRecord() 의 `판정` 키로 나간다.
  // 봇 실측은 node 에서 CORE 만 불러 돌린다 (결과.md 「참고 — 봇 실측」).
  pending: [],
};

function act(name, fn){ rec(name); const r=fn(); if(r) alert(r); render(); }
window.A = {
  start(){ UI.started=true; UI.startedAt=performance.now(); UI.lastFrame=UI.startedAt; UI.lastClick=UI.startedAt; rec('시작'); render(); },
  speed(x){ UI.speed=x; UI.speedLog.push({real:Math.round(UI.realPlayed), game:Math.round(S.time), speed:x}); rec('배속'+x); render(); },
  skip5(){ rec('5분건너뛰기'); for(let i=0;i<3000;i++) tick(S); render(); },
  pickup(){ act('줍기',()=>pickup(S)); },
  craft(k,n){ act('만들기'+(n==='all'?'전부':'1'),()=>{ craft(S,k,n); }); },
  craftAll(){ act('만들기전부(모두)',()=>{ craftAll(S); }); },
  sell(k,n){ act('팔기'+(n==='all'?'전부':'1'),()=>{ sell(S,k,n); }); },
  sellAll(){ act('팔기전부(모두)',()=>{ sellAll(S); }); },
  slot(i,which,v){ const sl=UI.slots[i]; if(which===0) sl.a=v; else sl.b=v; sl.dirty=true; rec('슬롯'); render(); },
  synth(i){ act('합성시작',()=>startSynth(S,UI.slots[i].a,UI.slots[i].b,i)); },
  buySlot(){ act('칸사기',()=>buySlot(S)); },
  buySpeed(){ act('단축사기',()=>buySpeed(S)); },
  buy(k){ act('구매'+SPECIES[k].t+'단계',()=>buy(S,k)); },
  sellMozzi(k){ act('찹쌀이팔기',()=>sellMozzi(S,k)); },
  copy(){ const t=document.getElementById('json'); t.select(); document.execCommand('copy'); rec('복사'); },
};

function frame(){
  const now=performance.now();
  if(UI.started){
    const dtReal=(now-UI.lastFrame)/1000; UI.lastFrame=now; UI.realPlayed+=dtReal;
    UI.acc+=dtReal*UI.speed;
    let n=0; while(UI.acc>=CONST.TICK && n<20000){ tick(S); UI.acc-=CONST.TICK; n++; }
    if(isStuck(S)) UI.stuckRealTime+=dtReal;
    if(!UI.idleFlagged && now-UI.lastClick>=3000){ UI.idleFlagged=true; UI.idleCount++; }
    if(!UI.snap30 && UI.realPlayed>=30*60) UI.snap30={gold:S.gold, dex:dexCount(S), synth:S.stats.synthStarted, mozzi:farmTotal(S), earned:S.stats.goldEarned, skip:UI.clicks['5분건너뛰기']||0};
  }
  render(); requestAnimationFrame(frame);
}
let lastRender=0;
// innerHTML 은 내용이 바뀐 상자만 다시 쓴다. 매 프레임 다시 쓰면 버튼이 깜빡이고 열린 <select> 목록이 닫힌다.
const lastHtml={};
function setHtml(id, html){ if(lastHtml[id]===html) return; lastHtml[id]=html; document.getElementById(id).innerHTML=html; }

// 합성소 칸 하나. 칸의 <select> 에 포커스가 있는 동안(목록 열림)은 그 칸만 안 그린다 — 다른 칸의 남은 시간은 계속 바뀐다.
function renderSlotCard(i){
  const el=document.getElementById('syn'+i);
  const n=slotCount(S);
  if(i>=n){
    el.className='card lock';
    const price=(i===n)?slotPrice(S):CONST.SLOT_PRICE[i-1];
    setHtml('syn'+i, `<b>${i+1}칸</b> 🔒 잠김<br><small>${price}골드${i===n?' — 아래 「칸 사기」':' (앞 칸부터)'}</small>`);
    return;
  }
  const sl=UI.slots[i], sy=S.synth[i];
  el.className='card'+(sy?' run':'');
  if(el.contains(document.activeElement) && !sl.dirty) return;
  sl.dirty=false;
  if(sy){
    setHtml('syn'+i, `<b>${i+1}칸</b> 합성 중<br>${SPECIES[sy.a].name}+${SPECIES[sy.b].name}<br>남은 시간 <b>${fmt(sy.remain)}</b> / ${fmt(sy.total)}`);
    return;
  }
  const opts=(sel)=>'<option value="">-</option>'+Object.keys(S.farm).map(k=>`<option value="${k}" ${sel===k?'selected':''}>${SPECIES[k].name} ×${S.farm[k]}</option>`).join('');
  const pv=preview(S,sl.a,sl.b); let pvHtml='';
  if(pv){
    const nm=k=>S.dex[k]?SPECIES[k].name:'???';
    pvHtml='<table>'+pv.outs.map(o=>`<tr><td>${Math.round(o.p*100)}%</td><td>${o.label}</td><td>${o.key?nm(o.key):(o.keys.length?o.keys.map(nm).join(' / '):'(후보 없음→정해진 종)')}</td></tr>`).join('')+'</table>'
      +`<small>비용 ${pv.cost.gold}골드 · ${fmt(pv.cost.time)}${S.speedLevel?` (단축 전 ${fmt(pv.cost.baseTime)})`:''}</small>`;
    if(farmTotal(S)-2<=0) pvHtml+='<p class="warn">농장 마지막 2마리예요!</p>';
  }
  const why=canSynth(S,sl.a,sl.b,i);
  setHtml('syn'+i, `<b>${i+1}칸</b> 비었다<br>
    슬롯1 <select onchange="A.slot(${i},0,this.value)">${opts(sl.a)}</select>
    슬롯2 <select onchange="A.slot(${i},1,this.value)">${opts(sl.b)}</select><br>
    ${pvHtml}<button onclick="A.synth(${i})" ${why?'disabled':''} style="font-size:14px">시작</button> <small>${why||''}</small>`);
}

function render(){
  const now=performance.now(); if(now-lastRender<150 && !UI.forceRender) return; lastRender=now;
  const spd=[1,10,60].map(x=>`<button class="${UI.speed===x?'on':''}" onclick="A.speed(${x})">×${x}</button>`).join('');
  setHtml('top', `
    ${UI.started?'':'<button onclick="A.start()" style="font-size:16px">▶ 시작 (30분 타이머 시작)</button>'}
    <b>게임 시각</b> ${fmt(S.time)} &nbsp; <b>골드</b> ${S.gold} &nbsp; 배속 ${spd} <button onclick="A.skip5()">5분 건너뛰기</button> <small>(${UI.clicks['5분건너뛰기']||0}회)</small>
    &nbsp; <b>실제 논 시간</b> ${fmt(UI.realPlayed)} / 30:00 ${UI.realPlayed>=1800?'<span class="warn">30분 지남</span>':''}`);

  // 농장
  let farmRows=Object.keys(S.farm).map(k=>{ const sp=SPECIES[k]; const br=(!sp.v&&S.farm[k]>=2)?fmt(CONST.BREED_PERIOD-(S.breedAcc[k]||0)):'—';
    return `<tr><td>${sp.name}</td><td>${sp.l}</td><td>${sp.t}</td><td>${S.farm[k]}</td><td>${br}</td><td><button onclick="A.sellMozzi('${k}')">팔기 ${CONST.MOZZI_SELL_PRICE}골드</button></td></tr>`; }).join('');
  const fsub=Object.keys(S.floor.sub).map(k=>`${subName(k)} ${S.floor.sub[k]}`).join(' · ');
  setHtml('farm', `<h3>농장 (${farmTotal(S)}마리)</h3>
    <table><tr><th>종</th><th>계열</th><th>단계</th><th>마리</th><th>번식까지</th><th></th></tr>${farmRows||'<tr><td colspan=6>비었다</td></tr>'}</table>
    <p>바닥 : 가루 ${S.floor.powder} · ${fsub||'부재료 0'} &nbsp; (${floorTotal(S)}/${CONST.FLOOR_CAP}) ${floorFull(S)?'<span class="full">가득 — 생산 멈춤</span>':''}</p>
    <button onclick="A.pickup()" style="font-size:14px">줍기 (바닥 전부 → 창고)</button>`);

  // 창고
  const subRows=Object.keys(S.wh.sub).map(k=>`<tr><td>${subName(k)}</td><td>${S.wh.sub[k]}</td><td><button onclick="A.craft('${k}',1)">떡 1개</button><button onclick="A.craft('${k}','all')">떡 전부</button></td></tr>`).join('');
  const riceRows=Object.keys(S.wh.rice).map(k=>`<tr><td>${riceName(k)}</td><td>${S.wh.rice[k]}</td><td>${ricePrice(k)}골드</td><td><button onclick="A.sell('${k}',1)">팔기 1개</button><button onclick="A.sell('${k}','all')">팔기 전부</button></td></tr>`).join('');
  setHtml('wh', `<h3>창고</h3><p>찹쌀가루 ${S.wh.powder}</p>
    <table><tr><th>부재료</th><th>수</th><th>가루1+부재료1→떡</th></tr>${subRows||'<tr><td colspan=3>없음</td></tr>'}</table>
    <button onclick="A.craftAll()">떡 전부 만들기</button>
    <table style="margin-top:4px"><tr><th>떡</th><th>수</th><th>값</th><th></th></tr>${riceRows||'<tr><td colspan=4>없음</td></tr>'}</table>
    <button onclick="A.sellAll()">떡 전부 팔기</button>`);

  // 합성소 : 머리 · 칸 1~4 · 칸/단축 사기
  setHtml('synthHead', `<h3>합성소 (${slotCount(S)}칸 · ${runningCount(S)}칸 가동 · 대기 ${Math.round(speedMult(S)*100)}%)</h3>`);
  for(let i=0;i<CONST.SLOT_MAX;i++) renderSlotCard(i);
  const sp=slotPrice(S), spd2=speedPrice(S);
  setHtml('synthShop', `<p>
    <button onclick="A.buySlot()" ${sp===null||S.gold<sp?'disabled':''}>칸 사기 ${sp===null?'(다 샀다)':`→ ${slotCount(S)+1}칸 ${sp}골드`}</button>
    &nbsp; <button onclick="A.buySpeed()" ${spd2===null||S.gold<spd2?'disabled':''}>단축 사기 ${spd2===null?'(다 샀다)':`→ ${S.speedLevel+1}단계 (대기 ${Math.round(CONST.SPEED_STEPS[S.speedLevel]*100)}%) ${spd2}골드`}</button>
    <small>지금 단축 ${S.speedLevel}/${CONST.SPEED_STEPS.length}단계 · 새로 거는 합성부터 적용</small></p>`);

  // 가판대
  const buyRows=openLineages(S).map(l=>'<tr><td>'+l+'</td>'+[1,2].map(t=>{ const k=l+t, p=buyPrice(S,k);
      return `<td>${p===null?'<small>'+(S.dex[k]?'':'???')+'</small>':`<button onclick="A.buy('${k}')" ${S.gold<p?'disabled':''}>${NAMES[l][t-1]} ${p}골드${S.farm[k]===1?' <b>(짝!)</b>':''}</button>`}</td>`; }).join('')
      +'<td><small>안 판다</small></td></tr>').join('');
  setHtml('shop', `<h3>가판대 (짝 구매)</h3><table><tr><th>계열</th><th>1단계</th><th>2단계</th><th>3단계·변종</th></tr>${buyRows}</table>
    <p><small>도감에 열린 일반 종만. 찹쌀이 팔기는 농장 표의 버튼 (${CONST.MOZZI_SELL_PRICE}골드)</small></p>`);

  // 도감
  setHtml('dexbox', `<h3>도감 ${dexCount(S)}/24</h3><div class="dex">`+
    SPECIES_LIST.map(sp=>`<div class="${S.dex[sp.key]?'got':''}">${S.dex[sp.key]?sp.name:'???'}<br><small>${sp.l} ${sp.t}${sp.v?' 변종':''}</small></div>`).join('')+'</div>');

  setHtml('log', S.log.slice(-30).reverse().join('<br>'));

  // 기록
  const j=buildRecord(), J=j.판정;
  const CRIT={'q2-1':{'①':'남은 골드 ÷ 번 골드 20% 이하','②':'30분에 5분 건너뛰기 20회 이하','③':'합성 2칸 이상 동시 가동 비율 50% 이상','④':'끝나고 한 판 더 · 질린 시점(분)'},
    'q2-2':{'①':'새 종 → 짝(2마리째)까지 게임 시간 10분 이하','②':'짝 구매가 골드 유출의 20~40%','③':'구매 횟수 ≤ 합성 횟수'}};
  const judgeRows=Object.keys(CRIT).map(q=>Object.keys(CRIT[q]).map(n=>{ const x=J[q][n]; const cls=x.통과===null?'':(x.통과?'pass':'fail');
    return `<tr><td>${q} ${n}</td><td>${CRIT[q][n]}</td><td>${x.값}</td><td class="${cls}">${x.통과===null?'—':(x.통과?'통과':'불통')}</td><td><small>${x.메모}</small></td></tr>`; }).join('')).join('');
  setHtml('record', `<h3>기록 · 자동 판정</h3>
    <table><tr><th>#</th><th>기준</th><th>값</th><th>판정</th><th>메모</th></tr>${judgeRows}</table>
    <p><small>골드 0 실제 시간 ${fmt(UI.stuckRealTime)} · 합성 시작/완료 ${S.stats.synthStarted}/${S.stats.synthDone} ·
    유출 골드 = 칸 ${S.stats.slotGold} + 단축 ${S.stats.speedGold} + 합성 ${S.stats.synthGold} + 짝 구매 ${S.stats.buyGold}</small></p>
    <p>30분 시점 : ${UI.snap30?`골드 ${UI.snap30.gold} · 번 골드 ${UI.snap30.earned} · 도감 ${UI.snap30.dex}칸 · 합성 ${UI.snap30.synth}회 · ${UI.snap30.mozzi}마리 · 건너뛰기 ${UI.snap30.skip}회`:'아직'}</p>
    <textarea id="json" readonly>${JSON.stringify(j)}</textarea><br><button onclick="A.copy()">JSON 복사</button>`);
}
// 내보내는 JSON. 1판 키 그대로 + 2판 키. 소단계 4~6 은 여기와 REC 에 칸을 더한다.
function buildRecord(){
  const c1=UI.stuckRealTime, c3=S.stats.synthStarted;
  return { 물음:'q2 골드 고리 2판', 실제논시간초:Math.round(UI.realPlayed), 게임시간초:Math.round(S.time), 버튼클릭:UI.clicks,
    기준1_골드0멈춤_실제초:Math.round(c1), 기준2_근사_3초무입력횟수:UI.idleCount, 기준3_합성시작:c3, 합성완료:S.stats.synthDone,
    배속기록:UI.speedLog, 골드:S.gold, 도감칸:dexCount(S), 마릿수:farmTotal(S), 번식:S.stats.bred, 구매:S.stats.bought, 찹쌀이팔기:S.stats.mozziSold, 떡판매:S.stats.riceSold, 번골드:S.stats.goldEarned,
    시점30분:UI.snap30,
    // --- 2판 ---
    건너뛰기횟수:UI.clicks['5분건너뛰기']||0, 칸수:slotCount(S), 단축단계:S.speedLevel,
    칸구매골드:S.stats.slotGold, 단축구매골드:S.stats.speedGold, 합성골드:S.stats.synthGold, 짝구매골드:S.stats.buyGold,
    동시2칸이상_게임초:Math.round(S.stats.multiRunTime), 가동_게임초:Math.round(S.stats.anyRunTime),
    짝까지_게임초:S.stats.pairWait,
    판정:judge(S,{skips:UI.clicks['5분건너뛰기']||0, realSec:UI.realPlayed, snap30:UI.snap30}),
    다음판:REC.pending,
    합성로그:S.log.filter(x=>x.includes('합성')||x.includes('단축')) };
}
render(); requestAnimationFrame(frame);
</script>
