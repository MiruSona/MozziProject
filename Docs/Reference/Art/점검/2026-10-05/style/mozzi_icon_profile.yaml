# arttool style extract 가 뽑은 조각 — 보고 고쳐서 프로필에 붙인다. 자동으로 안 붙는다
# 기준 그림 17장 — 도트 17장 (스프라이트 17 · 배경 0) · 도트 아님 0장
palette:
  # 한 색짜리 램프 1개 : gray_2 — 그늘 칸을 채우거나 뺀다
  ramp_len: 6   # 팔레트 파일과 짝
  ramps_file: "palettes/mozzi_icon.json"   # 팔레트를 그 자리로 옮긴 뒤
# style : outline : mixed (17장 중 11장 (65%)) — 프로필이 받는 값이 아니라 안 적었다
# style : light : 정하지 못함 (bottom 8 · top_left 3 · top_right 2 · top 2 · unknown 2) — 프로필 값 그대로
# style : style.scale : 1 — 프로필과 같아 뺐다 (17장 중 17장 (100%))
# check.warn : 판정 보류 — light 표가 갈렸다 — 종류가 섞인 무리로 보인다. 문턱 제안을 안 낸다
