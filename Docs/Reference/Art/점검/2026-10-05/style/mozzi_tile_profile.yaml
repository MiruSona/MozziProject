# arttool style extract 가 뽑은 조각 — 보고 고쳐서 프로필에 붙인다. 자동으로 안 붙는다
# 기준 그림 15장 — 도트 15장 (스프라이트 14 · 배경 1) · 도트 아님 0장
palette:
  # 한 색짜리 램프 4개 : green_2, green_3, orange_6, orange_7 — 그늘 칸을 채우거나 뺀다
  ramp_len: 6   # 팔레트 파일과 짝
  outline: null   # 외곽선 selout — 따로 쓰는 외곽선 색이 없다
  ramps_file: "palettes/mozzi_tile.json"   # 팔레트를 그 자리로 옮긴 뒤
style:
  # light : 정하지 못함 (unknown 8 · top_left 3 · top 3) — 프로필 값 그대로
  # style.scale : 1 — 프로필과 같아 뺐다 (15장 중 15장 (100%))
  outline: selout   # 14장 중 9장 (64%)
# check.warn : 판정 보류 — light 표가 갈렸다 — 종류가 섞인 무리로 보인다. 문턱 제안을 안 낸다
