# arttool style extract 가 뽑은 조각 — 보고 고쳐서 프로필에 붙인다. 자동으로 안 붙는다
# 기준 그림 5장 — 도트 5장 (스프라이트 1 · 배경 4) · 도트 아님 0장
palette:
  # 한 색짜리 램프 4개 : red_3, red_4, pink_2, red_5 — 그늘 칸을 채우거나 뺀다
  ramp_len: 6   # 팔레트 파일과 짝
  outline: null   # 외곽선 none — 따로 쓰는 외곽선 색이 없다
  ramps_file: "palettes/mozzi_bg.json"   # 팔레트를 그 자리로 옮긴 뒤
style:
  # light : 정하지 못함 (unknown 1) — 프로필 값 그대로
  # style.scale : 1 — 프로필과 같아 뺐다 (5장 중 5장 (100%))
  outline: "none"   # 1장 중 1장 (100%)
