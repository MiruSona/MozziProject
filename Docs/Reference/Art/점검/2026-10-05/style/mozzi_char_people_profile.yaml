# arttool style extract 가 뽑은 조각 — 보고 고쳐서 프로필에 붙인다. 자동으로 안 붙는다
# 기준 그림 17장 — 도트 17장 (스프라이트 17 · 배경 0) · 도트 아님 0장
palette:
  # 외곽선 판정 보류 — 검정 후보 #171717 를 팔레트 파일 outline 칸에만 넣었다
  # 한 색짜리 램프 5개 : gray, gray_2, blue_2, orange_5, pink — 그늘 칸을 채우거나 뺀다
  ramp_len: 6   # 팔레트 파일과 짝
  ramps_file: "palettes/mozzi_char_people.json"   # 팔레트를 그 자리로 옮긴 뒤
style:
  # outline : 정하지 못함 (solid 10 · black 6 · mixed 1) — 프로필 값 그대로
  # style.scale : 1 — 프로필과 같아 뺐다 (17장 중 17장 (100%))
  light: top   # 17장 중 11장 (65%) · 모름 6장
# check.warn : 판정 보류 — outline 표가 갈렸다 — 종류가 섞인 무리로 보인다. 문턱 제안을 안 낸다
