# arttool style extract 가 뽑은 조각 — 보고 고쳐서 프로필에 붙인다. 자동으로 안 붙는다
# 기준 그림 9장 — 도트 9장 (스프라이트 9 · 배경 0) · 도트 아님 0장
palette:
  # 외곽선 판정 보류 — 검정 후보 #000000 를 팔레트 파일 outline 칸에만 넣었다
  # 한 색짜리 램프 3개 : gray, gray_2, orange_8 — 그늘 칸을 채우거나 뺀다
  ramp_len: 6   # 팔레트 파일과 짝
  ramps_file: "palettes/mozzi_piece.json"   # 팔레트를 그 자리로 옮긴 뒤
# style : outline : 정하지 못함 (selout 5 · mixed 2 · solid 1 · black 1) — 프로필 값 그대로
# style : light : 정하지 못함 (unknown 5 · top 2 · top_right 1 · bottom 1) — 프로필 값 그대로
# style : style.scale : 1 — 프로필과 같아 뺐다 (9장 중 9장 (100%))
# check.warn : 판정 보류 — outline · light 표가 갈렸다 — 종류가 섞인 무리로 보인다. 문턱 제안을 안 낸다
